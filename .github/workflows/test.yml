name: test

# End to end: install naspeed with this action and run `naspeed test` on a
# crate, save the store to the Actions cache, then restore it in a second job
# and expect cache hits. Both jobs write the naspeed report to the summary.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  warm:
    name: warm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Create a test crate
        run: |
          cargo new --bin "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          cargo add itoa@1
          cargo add serde@1 --features derive
      - id: naspeed
        uses: ./
        with:
          # One key per run. The action appends the run attempt to the saved
          # key and restores by prefix, so reuse finds the newest store even
          # when only some warm jobs were re-run.
          cache-key: e2e-${{ github.run_id }}
          cache-save: 'true'
          args: test
          workdir: ${{ runner.temp }}/app
      - name: Check outputs
        env:
          VERSION: ${{ steps.naspeed.outputs.version }}
          CACHE_HIT: ${{ steps.naspeed.outputs.cache-hit }}
        run: |
          test -n "$VERSION"
          # A re-run restores the store an earlier attempt saved.
          test "$CACHE_HIT" = false || test "$GITHUB_RUN_ATTEMPT" -gt 1
          naspeed --version | grep -Fx "naspeed $VERSION"
          ns --version
      - name: cargo goes through naspeed
        run: naspeed status --check

  reuse:
    name: reuse (${{ matrix.os }})
    needs: warm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Create the same test crate
        run: |
          cargo new --bin "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          cargo add itoa@1
          cargo add serde@1 --features derive
      - id: naspeed
        uses: ./
        with:
          cache-key: e2e-${{ github.run_id }}
          cache-save: 'false'
          args: test
          workdir: ${{ runner.temp }}/app
      - name: Expect the store from warm
        env:
          CACHE_HIT: ${{ steps.naspeed.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: The build hit the restored store
        run: naspeed stats --json | jq -e 'map(.hits) | add > 0'

  install-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        with:
          version: '~0.1'
          install-only: 'true'
      - run: |
          naspeed --version
          test ! -e ~/.cargo/config.toml || ! grep -q naspeed ~/.cargo/config.toml
